<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Basket Courses</title>
    <style>
        body {
            color: #1f2933;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            margin: 32px auto;
            max-width: 880px;
            padding: 0 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 20px;
            margin-top: 32px;
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        input {
            border: 1px solid #a7b0ba;
            border-radius: 4px;
            font-size: 15px;
            padding: 8px 10px;
        }

        input[name="name"] {
            flex: 1;
        }

        button,
        .button {
            background: #245b7a;
            border: 0;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            display: inline-block;
            font-size: 15px;
            padding: 9px 14px;
            text-decoration: none;
        }

        .message {
            background: #e7f4ea;
            border-left: 4px solid #2f855a;
            margin-bottom: 18px;
            padding: 10px 12px;
        }

        .error {
            background: #fff1f0;
            border-left: 4px solid #c2410c;
            margin-bottom: 18px;
            padding: 10px 12px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            border-bottom: 1px solid #d8dee4;
            padding: 10px 0;
        }
    </style>
</head>
<body>
<h1>Basket Courses</h1>
<p>
    <a class="button" th:href="@{/basket-variation-mappings}">Basket Variation Mappings</a>
    <a class="button" th:href="@{/basket-statistics-export}">Basket Statistics Export</a>
</p>

<div class="message" th:if="${message}" th:text="${message}"></div>
<div class="error" th:if="${error}" th:text="${error}"></div>

<form method="post" th:action="@{/basket-courses}">
    <input name="name" type="text" placeholder="New course name">
    <button type="submit">Add Course</button>
</form>

<h2>Courses</h2>
<p th:if="${#lists.isEmpty(courses)}">No basket courses have been added yet.</p>
<ul th:unless="${#lists.isEmpty(courses)}">
    <li th:each="course : ${courses}">
        <a class="button" th:href="@{/basket-courses/{id}(id=${course.id})}" th:text="${course.name}">Course</a>
    </li>
</ul>
</body>
</html>
